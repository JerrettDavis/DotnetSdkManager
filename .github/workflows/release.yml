name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        run: ./scripts/publish.sh ${{ matrix.rid }}

      - name: Archive
        run: |
          cd .artifacts/publish/${{ matrix.rid }}
          zip -r "../../../dotnet-sdk-manager-${{ matrix.rid }}.zip" .

      - name: Checksum
        run: sha256sum "dotnet-sdk-manager-${{ matrix.rid }}.zip" > "dotnet-sdk-manager-${{ matrix.rid }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-manager-${{ matrix.rid }}
          path: |
            dotnet-sdk-manager-${{ matrix.rid }}.zip
            dotnet-sdk-manager-${{ matrix.rid }}.zip.sha256
          retention-days: 30

  nuget-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/DotnetSdkManager.Cli/DotnetSdkManager.Cli.csproj \
            --configuration Release \
            -p:Version="$version" \
            --include-symbols -p:SymbolPackageFormat=snupkg \
            --output nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg/*
          retention-days: 30

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dotnet-sdk-manager-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
