name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DotnetSdkManager.slnx

      - name: Build
        run: dotnet build DotnetSdkManager.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test tests/DotnetSdkManager.UnitTests/DotnetSdkManager.UnitTests.csproj
          --no-build --configuration Release
          --logger trx --results-directory TestResults/unit
          --collect:"XPlat Code Coverage"

      - name: Integration tests
        run: >
          dotnet test tests/DotnetSdkManager.IntegrationTests/DotnetSdkManager.IntegrationTests.csproj
          --no-build --configuration Release
          --logger trx --results-directory TestResults/integration
          --collect:"XPlat Code Coverage"

      - name: E2E tests (Testcontainers)
        env:
          RUN_E2E: "1"
        run: >
          dotnet test tests/DotnetSdkManager.E2ETests/DotnetSdkManager.E2ETests.csproj
          --no-build --configuration Release
          --logger trx --results-directory TestResults/e2e

      - name: Upload coverage (unit)
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/unit/**/coverage.cobertura.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload coverage (integration)
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/integration/**/coverage.cobertura.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
